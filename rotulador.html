<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotulador de fotos · TEC</title>
<style>
  :root { --bg:#14171a; --card:#1f2428; --line:#343b42; --tx:#f2f4f5; --mut:#9aa4ad; --ac:#ff7a1a; --ok:#35c26b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--tx); }
  main { max-width:560px; margin:0 auto; padding:14px 14px 40px; }
  h1 { font-size:18px; margin:4px 0 12px; }
  h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); margin:18px 0 8px; font-weight:600; }
  .chips { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .chip { padding:14px 8px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--tx); font-size:16px; font-weight:600; text-align:center; }
  .chip.on { border-color:var(--ac); background:#3a2413; }
  .chip small { display:block; font-weight:400; color:var(--mut); font-size:11px; margin-top:2px; }
  .num { display:flex; gap:8px; align-items:stretch; }
  .num button { width:64px; font-size:30px; font-weight:700; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--tx); }
  .num input { flex:1; min-width:0; text-align:center; font-size:30px; font-weight:700; padding:10px 4px; border-radius:12px; border:2px solid var(--line); background:#0f1113; color:var(--tx); }
  .num input.pref { flex:0 0 84px; font-size:22px; }
  .preview { margin:16px 0 10px; display:flex; justify-content:center; }
  .tag { background:#fff; color:#000; border-radius:14px; padding:10px 26px; text-align:center; font-size:24px; line-height:1.2; }
  .tag span { display:block; font-size:12px; color:#444; margin-top:2px; }
  .big { display:block; width:100%; padding:20px; font-size:21px; font-weight:800; border:0; border-radius:14px; background:var(--ac); color:#111; }
  .sec { display:block; width:100%; padding:13px; font-size:15px; font-weight:600; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--tx); margin-top:8px; }
  .big:active,.sec:active,.chip:active,.num button:active { transform:scale(.98); }
  details { margin-top:18px; border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--card); }
  summary { font-weight:600; font-size:15px; }
  label.row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; font-size:14px; border-bottom:1px solid var(--line); }
  label.row:last-of-type { border-bottom:0; }
  select, textarea { background:#0f1113; color:var(--tx); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:15px; font-family:inherit; }
  textarea { width:100%; min-height:130px; margin-top:6px; }
  input[type=checkbox] { width:22px; height:22px; accent-color:var(--ac); }
  .msg { min-height:20px; margin:10px 0 0; font-size:14px; color:var(--ok); text-align:center; }
  .msg.err { color:#ff6b6b; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .grid figure { margin:0; }
  .grid img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:8px; display:block; }
  .grid figcaption { font-size:10px; color:var(--mut); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hint { font-size:12px; color:var(--mut); margin:6px 0 0; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<main>
  <h1>Rotulador de fotos</h1>

  <h2>1 · Etapa</h2>
  <div class="chips" id="chips"></div>

  <h2>2 · Número</h2>
  <div class="num">
    <input class="pref" id="pref" aria-label="Prefijo" autocomplete="off">
    <button id="menos" aria-label="Restar uno">−</button>
    <input id="num" inputmode="numeric" aria-label="Número" autocomplete="off">
    <button id="mas" aria-label="Sumar uno">+</button>
  </div>

  <div class="preview"><div class="tag" id="tag"></div></div>

  <button class="big" id="btnCam">📷 Tomar foto</button>
  <button class="sec" id="btnGal">Rotular fotos de la galería (varias a la vez)</button>
  <p class="msg" id="msg"></p>

  <input type="file" id="fCam" accept="image/*" capture="environment">
  <input type="file" id="fGal" accept="image/*" multiple>

  <details>
    <summary>Ajustes</summary>
    <label class="row">Después de cada foto
      <select id="avance">
        <option value="no">No cambiar nada</option>
        <option value="etapa">Pasar a la etapa siguiente</option>
        <option value="camara">Pasar al número siguiente</option>
      </select>
    </label>
    <label class="row">Posición del rótulo
      <select id="pos">
        <option value="abajo">Abajo</option>
        <option value="arriba">Arriba</option>
        <option value="centro">Centro</option>
      </select>
    </label>
    <label class="row">Fecha y hora en el rótulo <input type="checkbox" id="fecha"></label>
    <label class="row">Guardar automáticamente en Descargas <input type="checkbox" id="auto"></label>
    <h2>Etapas (una por línea, en orden)</h2>
    <textarea id="etapasTxt" spellcheck="false"></textarea>
    <button class="sec" id="btnEtapas">Guardar etapas</button>
  </details>

  <h2 id="hSes" hidden>Fotos de esta sesión</h2>
  <div class="grid" id="grid"></div>
  <button class="sec" id="btnShare" hidden>Compartir / guardar las fotos de esta sesión</button>
  <button class="sec" id="btnClear" hidden>Vaciar la lista</button>
  <p class="hint" id="hint" hidden>La lista se borra al cerrar la página. Las fotos ya guardadas quedan en tu celular.</p>
</main>

<script>
(function () {
  var DEF = ['Excavación', 'Drenaje', 'Emplantillado', 'Cámara', 'Afinado', 'Satélite'];
  var KEY = 'tec-rotulador-v1';
  var st = { etapas: DEF.slice(), etapa: 0, pref: 'C-', num: 1, pos: 'abajo', fecha: true, auto: true, avance: 'no' };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    for (var k in saved) if (k in st) st[k] = saved[k];
    if (!Array.isArray(st.etapas) || !st.etapas.length) st.etapas = DEF.slice();
    if (st.etapa >= st.etapas.length) st.etapa = 0;
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  var fotos = [];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fechaTxt(d) { return pad(d.getDate()) + '-' + pad(d.getMonth() + 1) + '-' + d.getFullYear() + '  ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function limpio(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9-]+/g, ''); }
  function codigo() { return st.pref + st.num; }

  function render() {
    var c = $('chips'); c.innerHTML = '';
    st.etapas.forEach(function (e, i) {
      var b = document.createElement('button');
      b.className = 'chip' + (i === st.etapa ? ' on' : '');
      b.innerHTML = '';
      b.appendChild(document.createTextNode(e));
      var s = document.createElement('small'); s.textContent = 'Etapa ' + (i + 1); b.appendChild(s);
      b.onclick = function () { st.etapa = i; save(); render(); };
      c.appendChild(b);
    });
    $('pref').value = st.pref; $('num').value = st.num;
    $('avance').value = st.avance; $('pos').value = st.pos;
    $('fecha').checked = st.fecha; $('auto').checked = st.auto;
    $('etapasTxt').value = st.etapas.join('\n');
    var t = $('tag'); t.innerHTML = '';
    t.appendChild(document.createTextNode(st.etapas[st.etapa]));
    t.appendChild(document.createElement('br'));
    t.appendChild(document.createTextNode(codigo()));
    if (st.fecha) { var sp = document.createElement('span'); sp.textContent = fechaTxt(new Date()); t.appendChild(sp); }
  }

  function msg(txt, err) { var m = $('msg'); m.textContent = txt; m.className = 'msg' + (err ? ' err' : ''); }

  function setNum(v) { v = parseInt(v, 10); if (isNaN(v) || v < 0) v = 0; st.num = v; save(); render(); }
  $('menos').onclick = function () { setNum(st.num - 1); };
  $('mas').onclick = function () { setNum(st.num + 1); };
  $('num').onchange = function () { setNum(this.value); };
  $('pref').onchange = function () { st.pref = this.value; save(); render(); };
  $('avance').onchange = function () { st.avance = this.value; save(); };
  $('pos').onchange = function () { st.pos = this.value; save(); };
  $('fecha').onchange = function () { st.fecha = this.checked; save(); render(); };
  $('auto').onchange = function () { st.auto = this.checked; save(); };
  $('btnEtapas').onclick = function () {
    var l = $('etapasTxt').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
    if (!l.length) { msg('Escribe al menos una etapa.', true); return; }
    st.etapas = l; if (st.etapa >= l.length) st.etapa = 0; save(); render(); msg('Etapas guardadas.');
  };
  $('btnCam').onclick = function () { $('fCam').click(); };
  $('btnGal').onclick = function () { $('fGal').click(); };
  $('fCam').onchange = function () { procesar(this.files, true); this.value = ''; };
  $('fGal').onchange = function () { procesar(this.files, false); this.value = ''; };

  function cargar(file) {
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: 'from-image' }).catch(function () { return cargarImg(file); });
    }
    return cargarImg(file);
  }
  function cargarImg(file) {
    return new Promise(function (ok, no) {
      var u = URL.createObjectURL(file), i = new Image();
      i.onload = function () { URL.revokeObjectURL(u); ok(i); };
      i.onerror = function () { URL.revokeObjectURL(u); no(new Error('No se pudo leer la imagen')); };
      i.src = u;
    });
  }

  function caja(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function rotular(img, etapa, cod, fecha) {
    var w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
    var MAX = 3000, k = Math.min(1, MAX / Math.max(w0, h0));
    var W = Math.round(w0 * k), H = Math.round(h0 * k);
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, W, H);

    var fs = Math.round(Math.min(W, H) * 0.075), fs2 = Math.round(fs * 0.42);
    var font = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = fs + 'px ' + font;
    var tw = Math.max(ctx.measureText(etapa).width, ctx.measureText(cod).width);
    if (fecha) { ctx.font = fs2 + 'px ' + font; tw = Math.max(tw, ctx.measureText(fecha).width); }
    var padX = fs * 0.7, padY = fs * 0.45, lh = fs * 1.2;
    var bw = Math.min(W * 0.94, tw + padX * 2);
    var bh = padY * 2 + lh * 2 + (fecha ? fs2 * 1.6 : 0);
    var bx = (W - bw) / 2, m = fs * 0.6;
    var by = st.pos === 'arriba' ? m : st.pos === 'centro' ? (H - bh) / 2 : H - bh - m;

    ctx.fillStyle = 'rgba(255,255,255,0.96)';
    caja(ctx, bx, by, bw, bh, fs * 0.35); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = fs + 'px ' + font;
    ctx.fillText(etapa, W / 2, by + padY + lh * 0.5, bw - padX);
    ctx.fillText(cod, W / 2, by + padY + lh * 1.5, bw - padX);
    if (fecha) {
      ctx.fillStyle = '#333'; ctx.font = fs2 + 'px ' + font;
      ctx.fillText(fecha, W / 2, by + padY + lh * 2 + fs2 * 0.8, bw - padX);
    }
    if (img.close) img.close();
    return new Promise(function (ok, no) {
      cv.toBlob(function (b) { b ? ok(b) : no(new Error('No se pudo generar la foto')); }, 'image/jpeg', 0.9);
    });
  }

  function descargar(f) {
    var a = document.createElement('a');
    a.href = f.url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
  }

  function pintarLista() {
    var g = $('grid'); g.innerHTML = '';
    fotos.slice().reverse().forEach(function (f) {
      var fig = document.createElement('figure'), im = document.createElement('img'), cap = document.createElement('figcaption');
      im.src = f.url; im.alt = f.name; cap.textContent = f.name;
      fig.onclick = function () { descargar(f); };
      fig.appendChild(im); fig.appendChild(cap); g.appendChild(fig);
    });
    var hay = fotos.length > 0;
    $('hSes').hidden = !hay; $('btnClear').hidden = !hay; $('hint').hidden = !hay;
    $('btnShare').hidden = !(hay && navigator.canShare);
    if (hay) $('hSes').textContent = 'Fotos de esta sesión (' + fotos.length + ') · toca una para guardarla';
  }

  async function procesar(files, deCamara) {
    files = Array.prototype.slice.call(files || []);
    if (!files.length) return;
    var etapa = st.etapas[st.etapa], idx = st.etapa + 1, cod = codigo(), hechas = 0;
    msg('Rotulando ' + files.length + ' foto(s)…');
    for (var i = 0; i < files.length; i++) {
      try {
        var file = files[i];
        var d = new Date(deCamara ? Date.now() : (file.lastModified || Date.now()));
        var img = await cargar(file);
        var blob = await rotular(img, etapa, cod, st.fecha ? fechaTxt(d) : '');
        var sello = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
        var name = limpio(cod) + '_' + idx + '-' + limpio(etapa) + '_' + sello + (files.length > 1 ? '_' + (i + 1) : '') + '.jpg';
        var f = { name: name, blob: blob, url: URL.createObjectURL(blob) };
        fotos.push(f); hechas++;
        if (st.auto) { descargar(f); await new Promise(function (r) { setTimeout(r, 350); }); }
      } catch (e) { msg('Error en una foto: ' + e.message, true); }
    }
    pintarLista();
    if (hechas) msg('✔ ' + hechas + ' foto(s) rotulada(s): ' + etapa + ' ' + cod + (st.auto ? ' · guardadas en Descargas' : ''));
    if (deCamara && hechas) {
      if (st.avance === 'etapa') {
        st.etapa++; if (st.etapa >= st.etapas.length) { st.etapa = 0; st.num++; }
      } else if (st.avance === 'camara') { st.num++; }
      save(); render();
    }
  }

  $('btnShare').onclick = async function () {
    try {
      var fs = fotos.map(function (f) { return new File([f.blob], f.name, { type: 'image/jpeg' }); });
      if (!navigator.canShare || !navigator.canShare({ files: fs })) { msg('Este navegador no permite compartir archivos; toca cada foto para guardarla.', true); return; }
      await navigator.share({ files: fs });
    } catch (e) { if (e && e.name !== 'AbortError') msg('No se pudo compartir: ' + e.message, true); }
  };
  $('btnClear').onclick = function () {
    fotos.forEach(function (f) { URL.revokeObjectURL(f.url); });
    fotos = []; pintarLista(); msg('');
  };

  render(); pintarLista();
})();
</script>
</body>
</html>
